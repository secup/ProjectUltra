name: Build Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  # Every push builds, docs-only ones included: a commit without a run shows no status on GitHub,
  # so a docs-only HEAD made main look unbuilt (2026-11-09, a0eb5aa). A warm run is ~14 min.
  push:
    branches:
      - main
    tags:
      - "v*"
      - "0.2.0-alpha*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows dependencies come from vcpkg. Release-only triplet: every build here is Release, and
  # the default x64-windows triplet built each package twice (debug + release) — the cold gRPC
  # build took 89 min in run 42605639627. The HOST triplet (protoc, grpc_cpp_plugin) must be the
  # same: it defaults to x64-windows, and a host != target split builds gRPC, protobuf and abseil
  # twice (run 42622892678 was still in the cold install after 75 min). The test and build jobs
  # install the SAME set so they share one binary cache.
  VCPKG_TRIPLET: x64-windows-release

# Speed notes (2026-11-09, run 42605639627 took 1 h 39 min wall clock and failed):
#  - Tests build optimized (Release). The suite's cost was four Monte-Carlo calibration tests
#    running unoptimized (MCDPSKSnrCalibration alone: 16 min Linux, 23 min macOS, 27 min ASan).
#    Release is also what ships and what the local gate runs. Test asserts stay live in every
#    build type (tests/CMakeLists.txt add_compile_options(-UNDEBUG)).
#  - ccache (Linux/macOS) carries compiler output between runs through actions/cache.
#  - The bundle build no longer waits for the test jobs; only the tag release waits for all.
#  - The vcpkg cache is saved right after the install, not by the post-job hook, which only
#    runs when the whole job succeeds: run 42605639627 finished an 89-min gRPC build, failed in
#    a later step, and discarded it.
#  - GitHub-hosted runners for public repositories: Linux and Windows 4 vCPU / 16 GB,
#    macOS arm64 3 vCPU / 7 GB. The old --parallel 2 caps dated from the 7 GB Linux runner.

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Windows dominates when its vcpkg cache misses (a runner-image vcpkg update changes every
    # package hash): one cold gRPC build must be able to finish and save the cache.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            jobs: 4
          - os: macos-latest
            target: macos
            jobs: 3
          - os: windows-latest
            target: windows
            # --parallel 2: vcpkg's z-applocal post-build step copies the SAME runtime DLLs into
            # the shared tests output dir for every test target; two concurrent post-builds keep
            # the copy race improbable (run 28949911161). /MP (CL env below) parallelises the
            # compiles inside each project instead.
            jobs: 2
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Test Dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          ccache
          libhamlib-dev
          libgrpc++-dev
          libprotobuf-dev
          protobuf-compiler
          protobuf-compiler-grpc
          libabsl-dev
          libc-ares-dev
          libre2-dev

      - name: Install Test Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache hamlib grpc protobuf abseil c-ares

      - name: Restore ccache
        if: runner.os != 'Windows'
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-test-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-test-
            ccache-${{ matrix.target }}-

      - name: Read vcpkg Version (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-version
        shell: pwsh
        run: |
          $sha = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore vcpkg Binaries (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-v2-${{ env.VCPKG_TRIPLET }}-sdl2-grpc-${{ steps.vcpkg-version.outputs.sha }}
          restore-keys: |
            vcpkg-v2-${{ env.VCPKG_TRIPLET }}-sdl2-grpc-

      - name: Free Disk Space (Windows)
        # Only a cold vcpkg build needs the room (5 min of deletions); a warm restore does not.
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Get-PSDrive C, D | Format-Table -Property Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}, @{n="UsedGB";e={[math]::Round($_.Used/1GB,1)}}
          $targets = @(
            "C:\Android",
            "C:\Program Files (x86)\Android",
            "C:\Program Files\dotnet\sdk\NuGetFallbackFolder",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\ProgramData\chocolatey\lib\mingw",
            "C:\ProgramData\chocolatey\lib\android-sdk",
            "C:\ghcup"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Host "Removing $t ..."
              Remove-Item -Path $t -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C, D | Format-Table -Property Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}, @{n="UsedGB";e={[math]::Round($_.Used/1GB,1)}}

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg-cache" | Out-Null
          New-Item -ItemType Directory -Force "D:/vcpkg-bt" | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
          vcpkg install "sdl2:${{ env.VCPKG_TRIPLET }}" "grpc:${{ env.VCPKG_TRIPLET }}" --host-triplet=${{ env.VCPKG_TRIPLET }} --x-buildtrees-root=D:/vcpkg-bt --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save vcpkg Binaries (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF
          -DULTRA_FETCH_GRPC=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF
          -DULTRA_FETCH_GRPC=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}
          -DVCPKG_HOST_TRIPLET=${{ env.VCPKG_TRIPLET }}

      - name: Build Tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --parallel ${{ matrix.jobs }}
          ccache --show-stats

      - name: Save ccache
        if: always() && runner.os != 'Windows' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-test-${{ github.sha }}

      - name: Build Tests (Windows)
        if: runner.os == 'Windows'
        env:
          CL: /MP
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      - name: Run CTest (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Run CTest (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

  sanitizer:
    name: Sanitizer (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          ccache
          libhamlib-dev
          libgrpc++-dev
          libprotobuf-dev
          protobuf-compiler
          protobuf-compiler-grpc
          libabsl-dev
          libc-ares-dev
          libre2-dev

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-sanitizer-${{ github.sha }}
          restore-keys: |
            ccache-linux-sanitizer-

      - name: Configure ASAN/UBSAN
        run: >
          cmake -S . -B build-sanitizer
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DULTRA_BUILD_TESTS=ON
          -DULTRA_BUILD_TOOLS=OFF
          -DULTRA_BUILD_GUI=OFF
          -DULTRA_USE_FFTW=OFF
          -DULTRA_FETCH_GRPC=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g1"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      # -O1/-g1: the -O0/-g ASan build of the large DSP TUs OOM-killed cc1plus on the old 7 GB
      # runner (runs 28613422376 / 28634356779); -O1 is the standard ASan operating point.
      - name: Build ASAN/UBSAN Tests
        run: |
          cmake --build build-sanitizer --parallel 4
          ccache --show-stats

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-sanitizer-${{ github.sha }}

      # -LE slow: the four Monte-Carlo calibration gates (label "slow", tests/CMakeLists.txt) took
      # 52 of this job's 99 test-minutes; their code paths also run under ASan in the faster
      # MC-DPSK / OFDM / tone-ACK tests, and the Release test jobs run them in full.
      - name: Run ASAN/UBSAN CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan_suppressions.txt:print_suppressions=0
        run: ctest --test-dir build-sanitizer --output-on-failure --parallel 4 -LE slow

  coverage:
    name: Coverage (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Coverage Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            clang \
            llvm \
            libhamlib-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libabsl-dev \
            libc-ares-dev \
            libre2-dev

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-coverage-${{ github.sha }}
          restore-keys: |
            ccache-linux-coverage-

      - name: Run Coverage Gate
        env:
          CC: clang
          CXX: clang++
          LLVM_COV: llvm-cov
          LLVM_PROFDATA: llvm-profdata
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./scripts/coverage_report.sh

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-coverage-${{ github.sha }}

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Measured before 2026-11-09: linux ~4 min, macos ~3 min, windows ~12 min with a warm vcpkg
    # cache. A Windows vcpkg/GUI dependency install HUNG for >1h30m on 2026-07-26 (run
    # 30201252621); the cap must still let one cold gRPC build finish and save the cache.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libsdl2-dev \
            libgl1-mesa-dev \
            libhamlib-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libabsl-dev \
            libc-ares-dev \
            libre2-dev

      - name: Install macOS GUI Dependencies
        if: runner.os == 'macOS'
        run: brew install ccache sdl2 hamlib grpc protobuf abseil c-ares

      - name: Restore ccache
        if: runner.os != 'Windows'
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-build-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-build-
            ccache-${{ matrix.target }}-

      - name: Read vcpkg Version (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-version
        shell: pwsh
        run: |
          $sha = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore vcpkg Binaries (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-v2-${{ env.VCPKG_TRIPLET }}-sdl2-grpc-${{ steps.vcpkg-version.outputs.sha }}
          restore-keys: |
            vcpkg-v2-${{ env.VCPKG_TRIPLET }}-sdl2-grpc-

      - name: Free Disk Space (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Get-PSDrive C, D | Format-Table -Property Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}, @{n="UsedGB";e={[math]::Round($_.Used/1GB,1)}}
          $targets = @(
            "C:\Android",
            "C:\Program Files (x86)\Android",
            "C:\Program Files\dotnet\sdk\NuGetFallbackFolder",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\ProgramData\chocolatey\lib\mingw",
            "C:\ProgramData\chocolatey\lib\android-sdk",
            "C:\ghcup"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Host "Removing $t ..."
              Remove-Item -Path $t -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C, D | Format-Table -Property Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}, @{n="UsedGB";e={[math]::Round($_.Used/1GB,1)}}

      - name: Install Windows GUI Dependencies
        if: runner.os == 'Windows'
        id: vcpkg-install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg-cache" | Out-Null
          New-Item -ItemType Directory -Force "D:/vcpkg-bt" | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
          vcpkg install "sdl2:${{ env.VCPKG_TRIPLET }}" "grpc:${{ env.VCPKG_TRIPLET }}" --host-triplet=${{ env.VCPKG_TRIPLET }} --x-buildtrees-root=D:/vcpkg-bt --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save vcpkg Binaries (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DULTRA_BUILD_TESTS=OFF
          -DULTRA_BUILD_GUI=ON
          -DULTRA_USE_FFTW=OFF
          -DULTRA_FETCH_GRPC=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DULTRA_BUILD_TESTS=OFF
          -DULTRA_BUILD_GUI=ON
          -DULTRA_USE_FFTW=OFF
          -DULTRA_FETCH_GRPC=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}
          -DVCPKG_HOST_TRIPLET=${{ env.VCPKG_TRIPLET }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --parallel
          ccache --show-stats

      - name: Save ccache
        if: always() && runner.os != 'Windows' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-build-${{ github.sha }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # /MP compiles each project's files in parallel (4 at a time); two projects at once keeps
        # the peak at ~8 cl.exe on the 16 GB runner (unbounded --parallel with /MP could reach 16).
        env:
          CL: /MP
        run: cmake --build build --config Release --parallel 2

      - name: Collect Bundle Files
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/package_operator_bundle.sh build "${{ matrix.target }}" package
          ls -la "package/projectultra-${{ matrix.target }}"
          ls -la "package/dev-tools-${{ matrix.target }}"

      - name: Create ZIP Bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -r "projectultra-${{ matrix.target }}.zip" "projectultra-${{ matrix.target }}"
          zip -r "dev-tools-${{ matrix.target }}.zip" "dev-tools-${{ matrix.target }}"

      - name: Create ZIP Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "package/projectultra-windows/*" -DestinationPath "package/projectultra-windows.zip" -Force
          Compress-Archive -Path "package/dev-tools-windows/*" -DestinationPath "package/dev-tools-windows.zip" -Force

      - name: Upload Operator Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectultra-${{ matrix.target }}
          path: package/projectultra-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload Dev Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tools-${{ matrix.target }}
          path: package/dev-tools-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test
      - sanitizer
      - coverage
      - build
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: projectultra-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
